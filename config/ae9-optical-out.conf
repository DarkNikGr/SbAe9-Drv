# Separate optical output: the driver's PCM device 4, stereo 24-bit up to
# 192 kHz, on codec 2's S/PDIF converter 0x05.  It is independent of the
# main output.
#
# Install as ~/.config/pipewire/pipewire.conf.d/ae9-optical-out.conf
# then: systemctl --user restart pipewire
#
# SbAe9-SBC's "Optical Out Playback Switch" still enables/disables it.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = "alsa_output.ae9_optical"
            node.description = "Sound Blaster AE-9 Optical"
            node.nick        = "AE-9 Optical"
            media.class      = "Audio/Sink"
            api.alsa.path    = "hw:AE9,4"
            audio.format     = "S32LE"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            # below the main AE-9 output, never the default
            priority.session = 2000
            node.suspend-on-idle = true
        }
        flags = [ nofail ]
    }
]
