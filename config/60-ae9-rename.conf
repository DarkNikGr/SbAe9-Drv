#
# Friendly WirePlumber names for the AE-9 on the 3xHelix driver.
# The stock ACP nodes show the chipset string
# ("CA0132 Sound Core3D [Sound Blaster AE-7/AE-9] ...").
#
# This names the card's output and the head-unit microphone.  The optical
# and What U Hear adapters get their own names in ae9-optical-in.conf and
# ae9-what-u-hear.conf; the card itself is named by
# 90-sb-ae9-name.rules.
#
# Install as ~/.config/wireplumber/wireplumber.conf.d/60-ae9-rename.conf
# and remove/keep the optional 61-ae9-names.conf (this file includes the
# same microphone rule).  Then:
#   systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [ { alsa.driver_name = "snd_hda_codec_creative_ae9"
                  media.class = "Audio/Sink" } ]
    actions = { update-props = {
      node.description = "Sound Blaster AE-9 Output"
      node.nick = "AE-9 Output"
      priority.session = 7000
    } }
  },
  {
    matches = [ { alsa.driver_name = "snd_hda_codec_creative_ae9"
                  media.class = "Audio/Source"
                  node.name = "~alsa_input.pci-.*" } ]
    actions = { update-props = {
      node.description = "Sound Blaster AE-9 Microphone"
      node.nick = "AE-9 Mic"
    } }
  },
  {
    matches = [ { node.name = "alsa_input.ae9_optical" } ]
    actions = { update-props = {
      node.description = "Sound Blaster AE-9 Optical In"
      node.nick = "AE-9 Optical"
    } }
  },
  {
    matches = [ { node.name = "alsa_input.ae9_what_u_hear" } ]
    actions = { update-props = {
      node.description = "Sound Blaster AE-9 What U Hear"
      node.nick = "AE-9 What U Hear"
    } }
  }
]
