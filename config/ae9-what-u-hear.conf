# Optional: the AE-9's What U Hear loopback (what the card plays) as a
# PipeWire source, "AE-9 What U Hear", for recording or streaming the
# card's own output. Install as
#   ~/.config/pipewire/pipewire.conf.d/ae9-what-u-hear.conf
# then: systemctl --user restart pipewire
#
# It is the driver's third PCM device (hw:AE9,2), 48 or 96 kHz (driver
# 0.9.5+; set audio.rate = 96000 below for 96 kHz). It carries the stream
# as the card plays it, in Direct Mode and through the DSP.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = api.alsa.pcm.source
            node.name        = "alsa_input.ae9_what_u_hear"
            node.description = "Sound Blaster AE-9 What U Hear"
            node.nick        = "AE-9 What U Hear"
            media.class      = "Audio/Source"
            api.alsa.path    = "hw:AE9,2"
            audio.format     = "S32LE"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            # below the XLR mic, so it never becomes the default input
            priority.session = 100
            priority.driver  = 100
            node.suspend-on-idle = true
        }
        flags = [ nofail ]
    }
]
